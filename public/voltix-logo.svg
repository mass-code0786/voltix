<svg width="390" height="108" viewBox="0 0 390 108" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Voltix</title>
  <desc id="desc">VOLTIX logo with a dark metallic V, central gold lightning bolt, segmented circular metallic ring, and continuous wordmark with gold X.</desc>
  <defs>
    <linearGradient id="metalV" x1="13" y1="11" x2="94" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFCF7"/>
      <stop offset="0.13" stop-color="#8B9291"/>
      <stop offset="0.28" stop-color="#252B2D"/>
      <stop offset="0.46" stop-color="#07090A"/>
      <stop offset="0.61" stop-color="#596163"/>
      <stop offset="0.78" stop-color="#1B2022"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="goldBolt" x1="34" y1="4" x2="72" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5B8"/>
      <stop offset="0.18" stop-color="#F3D875"/>
      <stop offset="0.37" stop-color="#B98422"/>
      <stop offset="0.55" stop-color="#7D4F0A"/>
      <stop offset="0.74" stop-color="#F0C95B"/>
      <stop offset="1" stop-color="#8A5A10"/>
    </linearGradient>
    <linearGradient id="ringMetal" x1="5" y1="8" x2="101" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070809"/>
      <stop offset="0.17" stop-color="#D7D2B8"/>
      <stop offset="0.34" stop-color="#31383A"/>
      <stop offset="0.55" stop-color="#0B0D0E"/>
      <stop offset="0.73" stop-color="#D9B650"/>
      <stop offset="1" stop-color="#111518"/>
    </linearGradient>
    <linearGradient id="wordSilver" x1="125" y1="24" x2="322" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1F2EC"/>
      <stop offset="0.16" stop-color="#81898A"/>
      <stop offset="0.36" stop-color="#2D3335"/>
      <stop offset="0.58" stop-color="#101315"/>
      <stop offset="0.78" stop-color="#6F7778"/>
      <stop offset="1" stop-color="#171B1D"/>
    </linearGradient>
    <linearGradient id="wordGold" x1="328" y1="24" x2="371" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1A3"/>
      <stop offset="0.25" stop-color="#E6BC4E"/>
      <stop offset="0.5" stop-color="#9B6714"/>
      <stop offset="0.75" stop-color="#F4D36A"/>
      <stop offset="1" stop-color="#80500B"/>
    </linearGradient>
    <filter id="logoShadow" x="-8%" y="-8%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="1.15" flood-color="#F2CB5C" flood-opacity="0.58"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <path d="M22.5 80.5A42.5 42.5 0 0 1 81.2 20.8" stroke="url(#ringMetal)" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M88.7 27.8A42.5 42.5 0 0 1 84.4 82.5" stroke="url(#ringMetal)" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M30.2 21.5H47.4L55.6 43.7L62.8 65.1L70.6 43.7L79.1 21.5H96.2L69.2 86.5H56.4L30.2 21.5Z" fill="url(#metalV)"/>
    <path d="M37.8 27H45.2L60.2 67.1L57.4 73.2L37.8 27Z" fill="#FFFFFF" opacity="0.15"/>
    <path d="M73.1 28.2H86.3L68.5 71.7L63.5 81.8L73.1 28.2Z" fill="#FFFFFF" opacity="0.13"/>
    <path d="M53.4 7L42.9 48.2H56.4L49.1 101L82.9 39.2H66.8L74.2 7H53.4Z" fill="url(#goldBolt)" filter="url(#goldGlow)"/>
    <path d="M57.3 13.3L50.2 42.3H58.8L55.2 68.4L72.2 45.5H61.6L68 13.3H57.3Z" fill="#FFF8C9" opacity="0.24"/>
  </g>

  <g font-family="Montserrat, Inter, Arial, sans-serif" font-size="45" font-weight="900" letter-spacing="1.05">
    <text x="124" y="68" fill="#020303" opacity="0.62" transform="translate(2.2 3)">VOLTIX</text>
    <text x="124" y="68">
      <tspan fill="url(#wordSilver)">VOLTI</tspan><tspan fill="url(#wordGold)" filter="url(#goldGlow)">X</tspan>
    </text>
    <path d="M128 35H316" stroke="#FFFFFF" stroke-width="1.1" opacity="0.12"/>
  </g>
</svg>

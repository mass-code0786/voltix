<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050807" />
    <title>Voltix</title>
    <style>
      :root {
        color-scheme: dark;
        background: #050807;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(24, 255, 138, 0.14), transparent 11rem),
          linear-gradient(180deg, #050807 0%, #07110d 48%, #050807 100%);
        color: #f3f7f5;
        font-family: Arial, Helvetica, sans-serif;
      }

      img {
        width: min(13rem, 58vw);
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="/logo.png" alt="Voltix" />
  </body>
</html>
